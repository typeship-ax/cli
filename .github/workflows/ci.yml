name: CLI quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typeship CLI · build, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test
        run: npm test
      - name: Verify the CLI package boundary
        run: >-
          node -e "const p=require('./package.json');
          if(p.name!=='@typeship-ax/cli'||p.bin?.typeship!=='dist/cli.js'||Object.keys(p.bin??{}).length!==1)
          throw new Error('unexpected CLI package identity')"
      - name: Verify the published package
        run: npm pack --dry-run
