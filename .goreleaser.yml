# Generated by Typeship — https://typeship.dev
#
# Reproducible native packaging for typeship. One checkout cross-compiles
# every supported platform; each build is static (CGO_ENABLED=0), so the
# binaries run without Node.js or any other language runtime.
#
#   goreleaser build --snapshot --clean   # local matrix build into dist/
#   goreleaser release --clean            # tag-driven archives + checksums
version: 2

project_name: typeship

builds:
  - id: typeship
    main: .
    binary: typeship
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducibility: the same commit produces the same bytes. Windows
    # binaries are named typeship.exe automatically; see archives below.
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      # Stamp the version and mark the channel so `upgrade` can tell a
      # release download from a local build (main.version/main.builtBy).
      - -s -w -X main.version={{.Version}} -X main.builtBy=goreleaser

archives:
  - id: typeship
    ids: [typeship]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else }}{{ .Arch }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Archive entries take the commit time and a fixed owner, not the
    # checkout's, so rebuilding a release produces the same archive bytes.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: api.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: api.json
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

checksum:
    name_template: "checksums.txt"

snapshot:
    version_template: "{{ incpatch .Version }}-snapshot"

# Draft releases never reach users without a human review step.
release:
    draft: true
